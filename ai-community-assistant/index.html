
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Asistente de AI Community Lab">
  <title>AI Community Assistant</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f1f5f9;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 650px;
      padding: 32px;
      border: 1px solid #334155;
      border-radius: 18px;
      background: #1e293b;
    }

    .tag {
      color: #38bdf8;
      font-size: 13px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    .topics {
      display: grid;
      gap: 12px;
      margin-top: 25px;
    }

    .topic {
      padding: 16px;
      border-radius: 10px;
      background: #29384e;
    }

    footer {
      margin-top: 30px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">AI COMMUNITY LAB</span>

    <h1>AI Community Assistant</h1>

    <p>
      Tu punto de partida para aprender programación,
      inteligencia artificial y nuevas tecnologías.
    </p>

    <section class="topics">
      <div class="topic">🤖 Inteligencia artificial</div>
      <div class="topic">💻 Programación</div>
      <div class="topic">🧠 Modelos de IA</div>
      <div class="topic">🚀 Desarrollo de proyectos</div>
    </section>

    <footer>
      AI Community Lab · Proyecto 01 · Versión 0.1
    </footer>
  </main>
</body>
</html>
